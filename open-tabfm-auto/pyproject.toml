[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-tabfm-auto"
version = "0.1.0"
description = "Open-source TabFM-Auto: an LLM coding agent evolves the data pipeline around a frozen tabular foundation model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tabular", "foundation-model", "automl", "agents", "tabpfn", "tabicl", "feature-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openml>=0.14",
  "tabulate>=0.9",
  "openai>=1.40",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pyarrow>=14",
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
tabpfn = ["torch>=2.5", "tabpfn>=9.0", "huggingface_hub"]
tabicl = ["torch>=2.5", "tabicl>=2.2", "huggingface_hub"]
sdm = ["torch>=2.7", "structured-data-models @ git+https://github.com/NVIDIA/structured-data-models.git"]
exaone = ["torch>=2.5", "exaonetabular @ git+https://github.com/LGAI-Research/EXAONE-Tabular.git"]
baselines = ["lightgbm>=4.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/YarinBeni/open-tabfm-auto"
Paper = "https://arxiv.org/abs/2609.37989"

[project.scripts]
tabfm-auto = "tabfm_auto.cli:main"
tabfm-eval = "tabfm_auto.harness.cli:main"
tabfm-db = "tabfm_auto.agent.db_tool:main"
tabfm-models = "tabfm_auto.models.weights:main"
tabfm-runs = "tabfm_auto.logging_utils:summarize_cli"

[tool.setuptools.packages.find]
include = ["tabfm_auto*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF100"]
ignore = ["E501", "E702", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not gpu and not benchmark'"
markers = [
  "live: needs a real LLM endpoint or API key",
  "gpu: needs a GPU",
  "benchmark: long-running benchmark replication",
]
